# GitHub Actions workflow: on every pull request and push to main it checks formatting,
# types, lint, tests and the build.
#
# It lives here, switched off, because the tool that created this repository's first
# version was not allowed to add workflow files. To switch it on, from your own machine:
#
#   mkdir -p .github/workflows
#   git mv docs/ci/github-actions-ci.yml .github/workflows/ci.yml
#   git commit -m "ci: enable checks on pull requests" && git push
#
# An agent session cannot do it either: pushing a workflow needs a token with the
# `workflows` permission, and without it git rejects the whole push with
#   refusing to allow a GitHub App to create or update workflow ... without `workflows`
# permission
# A person with the repository's own credentials can, with the three commands above.
#
# Everything the job runs is known to pass: `npm run format:check` and `npm run check`
# (which is types, lint, tests and the build) both succeed on a clean checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
